services:
  emulator:
    build:
      context: .
      args:
        VERSION: ${VERSION:-dev}
    image: give-me-real-gpu:${VERSION:-dev}
    ports:
      # Fake OpenStack API. The management platform connects here, so it is published on the LAN.
      - "15000:15000"
      # Settings UI and API. There is no login, so it is published on this PC only.
      # To use it from another PC: ssh -L 15080:localhost:15080 <host>, then open http://localhost:15080/
      - "127.0.0.1:15080:15080"
    volumes:
      # Settings, sinks and topology (give-me-real-gpu.db). The image runs with -data /data.
      - data:/data
    restart: unless-stopped

volumes:
  data:
